<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Gerador de Propostas Victory</title>
<style>
@font-face{font-family:'Instrument Sans'; src:url('fonts/InstrumentSans.ttf') format('truetype-variations'); font-weight:400 700; font-stretch:75% 100%; font-display:swap;}
:root{
  --navy:#1B2F66; --navy-2:#14245A; --sky:#0099D9; --sky-light:#8DD3F0; --gold:#1B2F66;
  --paper-bg:#FFFFFF; --paper-tint:#FAF8F4; --paper-gray1:#4A4A4A; --paper-gray2:#6B655D; --paper-gray3:#A8A29A;
  --bg:#F4F1EC; --surface:#FFFFFF; --surface-2:#FAF8F4; --ink:#0A0A0A; --muted:#6B655D; --faint:#A8A29A;
  --border:#E3DED5; --accent:#1B2F66; --accent-ink:#FFFFFF; --danger:#B53B35; --danger-bg:#FDE0DE;
  --success:#1F8A5B; --success-bg:#DCF3E6; --focus:#1B2F66;
  --font-display:'Instrument Sans',system-ui,sans-serif; --font-body:'Instrument Sans',system-ui,-apple-system,sans-serif;
  --font-paper:'Instrument Sans',Calibri,'Segoe UI',Arial,sans-serif;
}
*{box-sizing:border-box;}
html,body{margin:0; padding:0;}
body{background:var(--bg); color:var(--ink); font-family:var(--font-body); min-height:100vh;}
h1,h2,h3,h4{font-family:var(--font-display); margin:0; text-wrap:balance;}
button{font-family:inherit;}
input,select,textarea{font-family:inherit; color:var(--ink); background:var(--surface);}
.hidden{display:none!important;}

.topbar{position:sticky; top:0; z-index:20; background:#0A0A0A; color:#fff;}
.topbar-inner{height:56px; padding:0 20px; display:flex; align-items:center; gap:16px; flex-wrap:nowrap;}
.topbar-logo{height:30px; width:auto; flex:none; filter:invert(1); display:block;}
.brandmark{display:flex; flex-direction:column; line-height:1.05;}
.brandmark b{font-family:var(--font-display); font-size:16px; letter-spacing:.06em;}
.brandmark span{font-size:9px; letter-spacing:.35em; color:var(--gold); font-weight:600;}
.app-name{font-size:13px; color:#B9B4AC; padding-left:16px; border-left:1px solid rgba(255,255,255,.18); white-space:nowrap; overflow:hidden; text-overflow:ellipsis; min-width:0; flex:0 1 auto;}
.topbar-actions{margin-left:auto; display:flex; gap:8px; flex:none;}

.btn{appearance:none; border:1px solid transparent; border-radius:8px; padding:8px 14px; font-size:13px; font-weight:600; cursor:pointer; display:inline-flex; align-items:center; gap:6px; white-space:nowrap;}
.btn:active{filter:brightness(.92);}
.btn-gold{background:var(--navy); color:#fff;}
.btn-gold:hover{background:var(--navy-2);}
.btn-ghost{background:rgba(255,255,255,.1); color:#fff; border-color:rgba(255,255,255,.25);}
.btn-ghost:hover{background:rgba(255,255,255,.18);}
.btn-line{background:transparent; color:var(--ink); border-color:var(--border);}
.btn-line:hover{background:var(--surface-2);}
.btn-sm{padding:5px 10px; font-size:12px; border-radius:7px;}
.btn[disabled]{opacity:.5; cursor:not-allowed;}
.icon-btn{width:30px; height:30px; display:inline-flex; align-items:center; justify-content:center; border-radius:7px; border:1px solid var(--border); background:var(--surface); color:var(--muted); cursor:pointer; font-size:14px;}
.icon-btn:hover{color:var(--danger); border-color:var(--danger);}

.tabbar{position:sticky; top:56px; z-index:19; background:var(--surface); border-bottom:1px solid var(--border); overflow-x:auto;}
.tabbar-inner{display:flex; gap:4px; min-width:max-content; padding:6px 16px;}
.tab{border:none; background:transparent; color:var(--muted); font-size:13px; font-weight:600; padding:9px 14px; border-radius:8px; cursor:pointer; display:flex; align-items:center; gap:7px; white-space:nowrap;}
.tab .count{background:var(--surface-2); color:var(--faint); border-radius:999px; font-size:11px; padding:1px 6px; font-weight:700;}
.tab.active{background:#0A0A0A; color:#fff;}
.tab.active .count{background:rgba(255,255,255,.2); color:#fff;}
.tab:hover:not(.active){background:var(--surface-2); color:var(--ink);}

.workbench{display:grid; grid-template-columns:1fr; gap:18px; padding:18px 16px 60px; max-width:1400px; margin:0 auto; align-items:start;}
@media (min-width:980px){
  .workbench{grid-template-columns:minmax(320px,480px) minmax(0,1fr);}
  .preview-col{position:sticky; top:104px; max-height:calc(100vh - 124px); overflow:auto;}
}
.panel{background:var(--surface); border:1px solid var(--border); border-radius:14px; padding:18px; min-width:0;}
.panel + .panel{margin-top:14px;}
.panel h2{font-size:15px; color:var(--ink); display:flex; align-items:center; gap:8px;}
.panel h2{flex-wrap:wrap; line-height:1.3;}
.panel h2 .tag{font-size:10px; font-weight:700; letter-spacing:.1em; text-transform:uppercase; color:var(--navy); background:#E8EDF7; padding:3px 9px; border-radius:999px; border:1px solid #C7D3EA;}
.panel-sub{font-size:12.5px; color:var(--muted); margin-top:2px;}
.field-grid{display:grid; grid-template-columns:1fr 1fr; gap:10px; margin-top:14px;}
@media (max-width:520px){.field-grid{grid-template-columns:1fr;}}
label.field{display:flex; flex-direction:column; gap:5px; font-size:12px; font-weight:600; color:var(--muted); min-width:0;}
label.field input, label.field select, label.field textarea{font-size:13.5px; font-weight:500; color:var(--ink); padding:8px 10px; border-radius:8px; border:1px solid var(--border); background:var(--surface); width:100%;}
label.field textarea{resize:vertical; min-height:56px; font-weight:400;}
label.field input:focus, label.field select:focus, label.field textarea:focus{outline:2px solid var(--focus); outline-offset:1px;}

.row-card{border:1px solid var(--border); border-radius:12px; padding:12px; margin-top:10px; background:var(--surface-2);}
.row-card-top{display:flex; align-items:center; gap:8px; margin-bottom:10px;}
.row-badge{font-size:10.5px; font-weight:700; letter-spacing:.04em; padding:3px 8px; border-radius:999px; background:var(--navy); color:#fff; text-transform:uppercase;}
.row-badge.suites{background:var(--sky);}
.row-grid{display:grid; grid-template-columns:repeat(auto-fit,minmax(165px,1fr)); gap:10px;}
.row-grid label.field.wide{grid-column:span 2;}
.row-grid label.field{font-size:11px;}
.row-grid input, .row-grid select{padding:7px 8px; font-size:13px;}
.add-row-btn{margin-top:12px; width:100%; border:1.5px dashed var(--border); border-radius:10px; background:transparent; color:var(--muted); padding:10px; font-size:13px; font-weight:600; cursor:pointer;}
.add-row-btn:hover{border-color:var(--gold); color:var(--ink);}

.cond-item{display:flex; align-items:flex-start; gap:8px; margin-top:8px;}
.cond-item textarea{flex:1; min-height:38px;}
.cond-drag{color:var(--faint); font-size:12px; padding-top:9px;}

.photo-grid{display:grid; grid-template-columns:repeat(auto-fill,minmax(120px,1fr)); gap:10px; margin-top:12px;}
.photo-card{border:1px solid var(--border); border-radius:10px; overflow:hidden; background:var(--surface);}
.photo-card img{width:100%; height:86px; object-fit:cover; display:block; background:var(--surface-2);}
.photo-card .pc-body{padding:7px 8px;}
.photo-card .pc-name{font-size:11.5px; color:var(--muted); margin-top:2px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap;}
.photo-card .pc-actions{display:flex; justify-content:flex-end; padding:0 6px 6px;}
.upload-zone{border:1.5px dashed var(--border); border-radius:12px; padding:18px; text-align:center; margin-top:12px; color:var(--muted); font-size:13px;}
.upload-zone.drag{border-color:var(--gold); background:var(--surface-2);}
.logo-slot{display:flex; align-items:center; gap:12px; margin-top:10px; padding:12px; border:1px solid var(--border); border-radius:10px; background:var(--surface-2);}
.logo-slot img{max-height:46px; max-width:140px; object-fit:contain;}
.logo-slot .ls-empty{width:140px; height:46px; display:flex; align-items:center; justify-content:center; font-size:10px; color:var(--faint); border:1px dashed var(--border); border-radius:6px;}

.prop-row{display:flex; align-items:center; gap:10px; padding:10px; border:1px solid var(--border); border-radius:10px; margin-top:8px; background:var(--surface-2);}
.prop-row .pr-main{min-width:0; flex:1;}
.prop-row .pr-title{font-size:13.5px; font-weight:700; overflow:hidden; text-overflow:ellipsis; white-space:nowrap;}
.prop-row .pr-sub{font-size:11.5px; color:var(--muted); margin-top:1px;}
.prop-row .pr-actions{display:flex; gap:6px;}

.empty-note{font-size:12.5px; color:var(--faint); padding:10px 0;}
.example-banner{background:#E8EDF7; border:1px solid #C7D3EA; border-radius:10px; padding:11px 14px; margin-bottom:14px; font-size:13px; line-height:1.45; color:var(--navy);}
.example-banner b{font-weight:700;}

#toast{position:fixed; left:50%; bottom:22px; transform:translateX(-50%) translateY(20px); background:var(--ink); color:var(--surface); padding:10px 16px; border-radius:10px; font-size:13px; font-weight:600; opacity:0; pointer-events:none; transition:opacity .2s, transform .2s; z-index:50; max-width:90vw; text-align:center;}
#toast.show{opacity:1; transform:translateX(-50%) translateY(0);}
#toast.err{background:var(--danger);}
#toast.ok{background:var(--success);}

#authGate{position:fixed; inset:0; background:#0A0A0A; color:#fff; display:flex; align-items:center; justify-content:center; z-index:100; padding:20px;}
#authGate .box{background:rgba(255,255,255,.06); border:1px solid rgba(255,255,255,.2); border-radius:14px; padding:26px; max-width:360px; width:100%; text-align:center;}
#authGate .box b{font-family:var(--font-display); font-size:18px; display:block; margin-bottom:6px;}
#authGate .box p{font-size:13px; color:#C9CFDD; margin:0 0 16px;}
#authGate input{width:100%; padding:10px 12px; border-radius:8px; border:1px solid rgba(255,255,255,.3); background:rgba(255,255,255,.08); color:#fff; font-size:14px; margin-bottom:10px;}
#authGate .err{color:#F3B3A3; font-size:12.5px; min-height:16px; margin-bottom:6px;}

.paper-wrap{min-width:0;}
.paper{background:var(--paper-bg); color:#111; font-family:var(--font-paper); width:100%; max-width:760px; margin:0 auto; border-radius:4px; overflow:hidden; box-shadow:0 2px 18px rgba(0,0,0,.14); font-size:13px; line-height:1.4;}
.p-header-row{display:flex; justify-content:flex-end; padding:14px 22px 0;}
.p-header-row img{max-height:46px; max-width:160px; object-fit:contain;}
.p-header-row .wordmark{font-family:var(--font-paper); text-align:right; line-height:1.05;}
.p-header-row img{height:42px; max-height:none; width:auto;}
.p-titleblock{background:#0A0A0A; color:#fff; padding:20px 22px;}
.p-titleblock h1{font-size:22px; color:#fff; font-family:var(--font-paper); font-weight:700;}
.p-titleblock .sub{color:var(--sky-light); font-size:12px; margin-top:4px;}
.p-info{display:grid; grid-template-columns:repeat(3,1fr); gap:10px; padding:14px 22px; border-bottom:1px solid #D9D9D9;}
.p-info div b{display:block; font-size:10px; color:var(--paper-gray2); font-weight:600; text-transform:uppercase;}
.p-info div span{display:block; font-size:13.5px; font-weight:700; color:var(--navy); margin-top:3px;}
.p-para{padding:12px 22px; border-bottom:1px solid #D9D9D9;}
.p-para .lbl{font-size:10px; color:var(--navy); font-weight:700; letter-spacing:.12em; text-transform:uppercase;}
.p-para .nm{font-size:14px; font-weight:700; margin-top:3px;}
.p-para .rf{font-size:12px; color:var(--paper-gray1); margin-top:2px;}
.p-section{padding:10px 22px 0;}
.p-section h3{font-size:12px; color:var(--navy); font-weight:700; letter-spacing:.1em; text-transform:uppercase; border-bottom:2px solid var(--navy); padding-bottom:5px; margin-bottom:9px; font-family:var(--font-paper);}
.p-kv{width:100%; border-collapse:collapse; margin-bottom:4px;}
.p-kv td{padding:5px 10px; font-size:12.5px; border-bottom:1px solid #fff;}
.p-kv td.k{background:var(--navy); color:#fff; font-weight:700; width:32%; font-size:10.5px; letter-spacing:.06em; text-transform:uppercase;}
.p-kv tr:nth-child(odd) td.v{background:var(--paper-tint);}
.p-kv td.v b{color:var(--navy);}
.p-rate-banner{color:var(--navy); font-weight:700; font-size:11px; margin:6px 0;}
table.p-rate{width:100%; border-collapse:collapse; margin-bottom:6px;}
table.p-rate th{background:var(--navy); color:#fff; font-size:10.5px; padding:7px 8px; text-align:center; font-weight:700;}
table.p-rate th:first-child{text-align:left;}
table.p-rate td{padding:6px 8px; font-size:12px; text-align:center; border-bottom:1px solid #EEE;}
table.p-rate td:first-child{text-align:left; font-weight:700;}
table.p-rate tr.odd td{background:var(--paper-tint);}
.p-strike{display:block; text-decoration:line-through; color:var(--paper-gray3); font-size:10.5px;}
.p-final{display:block; font-weight:700; color:var(--navy); font-size:12.5px;}
.p-note{font-size:11px; font-style:italic; color:var(--paper-gray2); padding:2px 0 10px;}
.p-thumbs{display:flex; gap:12px; margin:8px 0 12px;}
.p-thumbs figure{margin:0; flex:1 1 0; min-width:0;}
.p-thumbs img{width:100%; height:112px; object-fit:cover; display:block; background:#EFEBE3;}
.p-thumbs figcaption{font-size:9.5px; line-height:1.4; color:var(--paper-gray2); padding-top:5px;}
.p-thumbs figcaption b{display:block; font-size:10.5px; color:#0A0A0A;}
.p-cond{list-style:none; margin:0; padding:0;}
.p-cond li{display:flex; gap:8px; font-size:11.5px; padding:5px 8px; border-radius:3px;}
.p-cond li:nth-child(odd){background:var(--paper-tint);}
.p-cond li .ck{color:var(--sky); font-weight:700;}
.p-sign{text-align:center; padding:16px 22px 6px; font-size:12px; color:var(--paper-gray1);}
.p-sign .ln{margin:10px auto 4px; width:70%; border-bottom:1px solid var(--paper-gray1);}
.p-sign b{display:block; color:var(--navy); font-size:13px; margin-top:2px;}
.p-closing{height:14px; background:#0A0A0A; margin-top:8px;}
.p-footer{text-align:center; font-size:10px; color:var(--paper-gray2); padding:10px 22px;}
.p-footer b{color:var(--navy);}
</style>
</head>
<body>

<div id="authGate" class="hidden">
  <div class="box">
    <img src="assets/victory-logo.png" alt="Victory Hotéis" style="width:170px; filter:invert(1); margin:0 auto 14px; display:block;">
    <p>Ferramenta interna — digite a senha de acesso.</p>
    <input type="password" id="authInput" placeholder="Senha">
    <div class="err" id="authErr"></div>
    <button class="btn btn-gold" id="authBtn" style="width:100%; justify-content:center;">Entrar</button>
  </div>
</div>

<div id="toast"></div>

<header class="topbar">
  <div class="topbar-inner">
    <img class="topbar-logo" src="assets/victory-logo.png" alt="Victory Hotéis">
    <span class="app-name">Gerador de Propostas</span>
    <div class="topbar-actions">
      <button class="btn btn-ghost btn-sm" id="btnNew">+ Nova</button>
      <button class="btn btn-ghost btn-sm" id="btnSave">Salvar</button>
      <button class="btn btn-gold btn-sm" id="btnExport">Baixar PDF</button>
    </div>
  </div>
</header>

<nav class="tabbar"><div class="tabbar-inner" id="tabbarInner"></div></nav>

<main class="workbench">
  <div class="form-col" id="formCol"></div>
  <div class="preview-col paper-wrap" id="previewCol"><div class="paper" id="paper"></div></div>
</main>

<script src="https://cdn.jsdelivr.net/npm/jspdf@2.5.2/dist/jspdf.umd.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/jspdf-autotable@3.8.4/dist/jspdf.plugin.autotable.min.js"></script>
<script src="app.js"></script>
</body>
</html>
